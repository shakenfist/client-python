[tox]
# py3, not py37: 3.7 is the floor this package supports, not an interpreter
# a developer is likely to have, so naming it here made a bare "tox" fail to
# build an environment at all. CI runs py3 for the same reason. The py37
# environment below is kept for anyone who does have that interpreter and
# wants to check the floor.
envlist = py3,flake8,cover
isolated_build = true

[testenv]
extras =
  test
commands =
    # NOTE: you can run any command line tool here - not just tests
    stestr run {posargs}
allowlist_externals =
  bash
  find
  rm
  env
setenv =
  VIRTUAL_ENV={envdir}
  LANGUAGE=en_US
  LC_ALL=en_US.utf-8
  OS_STDOUT_CAPTURE=1
  OS_STDERR_CAPTURE=1
  OS_TEST_TIMEOUT=160
  PYTHONDONTWRITEBYTECODE=1

[testenv:flake8]
description =
  Run style checks on the changes made since HEAD~.
envdir = {toxworkdir}/shared
commands =
  bash tools/flake8wrap.sh -HEAD

[testenv:py37]
description =
  Run python3.7 unit tests

[testenv:cover]
description =
  Generate a coverage report in cover/.
setenv =
  PYTHON=coverage run --source client --parallel-mode
commands =
  coverage erase
  stestr run {posargs}
  coverage combine
  coverage html -d cover
  coverage report
