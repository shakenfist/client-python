# Triggers a re-review of a PR when an authorized user comments
# "@shakenfist-bot please re-review"
#
# Template source: shakenfist/development/templates/ci-review-automation/
#
# The trigger and the review are separate jobs on purpose. A claude-code
# runner is scarce, and doing the permission check, the reaction and the
# refusal reply on one would hold a claude-code runner for every comment
# containing the phrase -- including comments from people with no write
# access at all.
#
# The trigger handling is pr-bot-trigger rather than inline shell, and
# the choice of commit to review is pr-review-ref, both taken at @main.
# A copy of either would drift from the shared action and miss its
# fixes, and pr-bot-trigger's include the refusal of fork pull
# requests that the re-review job below depends on.
name: PR Re-review

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  issue_comment:
    types: [created]

jobs:
  trigger-re-review:
    name: "Trigger re-review"
    # Only run on PR comments (not issue comments), and never on a
    # comment the bot itself posted: the automated review is
    # model-generated text posted to the pull request, and a review
    # that mentions a trigger phrase would re-fire the lane.
    # contains() does not care that the phrase is inside a quote.
    # The type test catches github-actions[bot]. shakenfist-bot is a
    # User-type account with admin rights, so a comment it posts
    # through a token passes both that test and pr-bot-trigger's
    # permission check, and needs its login named.
    if: |
      github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      github.event.comment.user.login != 'shakenfist-bot' &&
      contains(github.event.comment.body, '@shakenfist-bot please re-review')
    runs-on: [self-hosted, static]
    # Just a few gh API calls, so anything beyond this is a hang.
    timeout-minutes: 10
    outputs:
      confirmed: ${{ steps.trigger.outputs.confirmed }}
      same_repo: ${{ steps.trigger.outputs.same-repo }}
      pr_number: ${{ github.event.issue.number }}

    steps:
      # pr-bot-trigger refuses fork pull requests as well as
      # unauthorised commenters. It also vouches for its own outputs:
      # `confirmed` is 'true' only when the request was triggered,
      # authorized and from this repository with a pr-ref set, and when
      # it cannot tell, the action fails and says so on the pull request
      # itself. So this file does not re-read the other outputs to check
      # them. pr-retest.yml relies on it the same way.
      - name: Handle trigger
        id: trigger
        uses: shakenfist/actions/pr-bot-trigger@main
        with:
          trigger-phrase: 'please re-review'
          reaction: 'rocket'

  re-review:
    name: "Re-review PR"
    needs: trigger-re-review
    # same_repo is redundant -- pr-bot-trigger already folds it into
    # confirmed -- and it is here anyway. This job puts a pull
    # request's code on a runner holding a write-scoped token, so the
    # fork guard is the one thing in this file worth stating twice: a
    # regression in the shared action cannot quietly widen what runs
    # here, and a reader (or a scanner) can see the restriction without
    # leaving the file.
    if: >-
      needs.trigger-re-review.outputs.confirmed == 'true' &&
      needs.trigger-re-review.outputs.same_repo == 'true'
    runs-on: [self-hosted, claude-code]
    # A review normally finishes in three to six minutes. Without this
    # the job inherits the six hour GitHub default, so a wedged Claude
    # run would hold a scarce claude-code runner for the rest of the day.
    timeout-minutes: 60
    # Two re-review requests in quick succession would otherwise run
    # concurrently on the scarce runner and post two reviews on the same
    # pull request. The group is this lane's own. The automatic lane --
    # the reusable pr-auto-review.yml workflow in shakenfist/actions,
    # called from this project's CI workflow -- has a separate one, so
    # the two can run at once. That is deliberate: the automatic review
    # does not force, so it skips a pull request the bot has already
    # reviewed, and the two overlap only when a re-review is asked for
    # while the first review is still running. A group shared across
    # both would let either cancel the other.
    concurrency:
      group: pr-re-review-${{ github.event.issue.number }}
      cancel-in-progress: true

    steps:
      # The pull request's code, not the default branch. Without a ref:
      # an issue_comment event checks out the default branch, and
      # review-pr-with-claude.sh opens every prompt by reading
      # AGENTS.md, ARCHITECTURE.md and README.md from the working
      # directory -- so a re-review would judge the change against the
      # conventions as they were *before* it. The diff itself comes
      # from the API and is unaffected, which is what makes the symptom
      # subtle: a real review, calibrated wrongly.
      # The reusable pr-auto-review.yml workflow in shakenfist/actions
      # checks out the merge ref for this reason and says so in its
      # header.
      #
      # This puts the pull request's code on the runner, which is
      # exactly why pr-bot-trigger refusing fork pull requests above is
      # load bearing rather than tidiness.
      #
      # persist-credentials: false because this working tree holds the
      # pull request's code and the reviewer reads it. The default
      # leaves a write-scoped token in .git/config of exactly that tree.
      # review-pr-with-claude authenticates gh from GH_TOKEN and never
      # pushes, so it does not need the git credential helper.
      #
      # The merge ref is resolved rather than named, because a named one
      # is right only when GitHub's copy is both present and current, and
      # it can be neither: GitHub recomputes the merge commit
      # asynchronously after a push, so for a while the published ref
      # merges the previous head. pr-review-ref confirms the merge
      # commit's second parent is the current head, retries briefly, and
      # otherwise falls back to the head ref. Its header in
      # shakenfist/actions (tools/pr-review-ref.sh) has the measurements
      # behind this, and its tests run every path.
      - name: Resolve the ref to review
        id: ref
        # A composite action cannot time its own steps, so the timeout is
        # here: a hung API call would otherwise hold the claude-code
        # runner for the job's hour. Six tries five seconds apart need
        # well under this.
        timeout-minutes: 5
        uses: shakenfist/actions/pr-review-ref@main
        with:
          mode: resolve
          pr-number: ${{ needs.trigger-re-review.outputs.pr_number }}

      - name: Checkout the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      # core.hooksPath=/dev/null because the checkout above put the
      # pull request's code on the runner and the steps after it run
      # over that tree. Hooks are not tracked in a checkout, so this is
      # defence in depth rather than a hole being closed -- but the
      # security model claims the control, and a claimed control that
      # is not set is worse than one that was never promised. It sits
      # immediately after the checkout so the ordering the model
      # describes holds by construction: a step added below it inherits
      # the setting whether or not whoever added it was thinking about
      # hooks. Set on the repository rather than --global: this job
      # runs on the shared claude-code pool, and a global setting would
      # change state every other repository's jobs on that machine
      # inherit. The security model is documented at
      # https://github.com/shakenfist/development/blob/main/docs/ci-review-automation.md
      - name: Disable git hooks
        run: git config core.hooksPath /dev/null

      # The resolve step validated a sha but the checkout named a ref,
      # and a push between the two moves what the ref reaches, so
      # confirm that the tree is the commit that was validated: HEAD^2
      # on the merge path, HEAD on the head path. It fails loudly rather
      # than reviewing a commit nobody validated; the requester can ask
      # again, and a wrong review looks right. It runs on both paths,
      # with no if:, because the head ref is as much a name as the merge
      # ref and has the same race.
      - name: Confirm the checkout is the validated commit
        id: confirm
        timeout-minutes: 2
        uses: shakenfist/actions/pr-review-ref@main
        with:
          mode: confirm
          head-sha: ${{ steps.ref.outputs.head-sha }}
          merged: ${{ steps.ref.outputs.merged }}

      # Which ref was reviewed is a property of the review, so say it on
      # the pull request rather than only in the run log. A review of the
      # head is worth having; a reader who thinks it is a review of the
      # merge result is not. Posted by the bot, so the bot-comment guard
      # on the trigger job above keeps it from re-firing this workflow.
      #
      # The cause comes from the resolve step rather than being asserted
      # here. A conflict with the base is the least likely of the three
      # paths into this step -- pr-review-ref's header has the
      # measurement -- and a reader told of one on a pull request that
      # merges cleanly would go looking for a conflict which is not
      # there. The body is assembled with a heredoc because a multi-line
      # --body argument keeps its newlines, and GitHub renders those as
      # line breaks, which breaks one sentence into several short lines.
      - name: Say that the head was reviewed, not the merge result
        if: steps.ref.outputs.merged == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.trigger-re-review.outputs.pr_number }}
          REPO: ${{ github.repository }}
          REASON: ${{ steps.ref.outputs.reason }}
        run: |
          # Assembled by appending rather than written across source
          # lines: a literal newline inside cause survives into the
          # comment body, and GitHub renders single newlines as line
          # breaks.
          case "${REASON}" in
            stale)
              cause="the merge commit GitHub publishes for it still merges"
              cause="${cause} an earlier head, and had not caught up by the"
              cause="${cause} time this review started"
              ;;
            unreadable)
              cause="the merge commit GitHub publishes for it could not be"
              cause="${cause} read"
              ;;
            *)
              cause="GitHub is not publishing a merge commit for it at all,"
              cause="${cause} which can mean the branch conflicts with its"
              cause="${cause} base"
              ;;
          esac
          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body-file - <<EOF
          Reviewing this pull request's head rather than its merge result: ${cause}. The review is of the proposed change itself, but it has not seen how that change lands on the base branch.
          EOF

      - name: Run automated reviewer
        id: review
        uses: shakenfist/actions/review-pr-with-claude@main
        with:
          pr-number: ${{ needs.trigger-re-review.outputs.pr_number }}
          force: 'true'

      # Every step above runs after the rocket reaction, and a failure
      # in any of them before the reviewer starts would otherwise end
      # the request in silence: the confirm step's "comment again" is
      # only in the run log, which the requester is unlikely to open.
      # The reviewer's own failures are left to review-pr-with-claude,
      # which reports them itself, hence the gate on it having been
      # skipped rather than on failure() alone. A run cancelled by a
      # newer request is not a failure, so this stays quiet then too.
      #
      # The head moving is the one failure with a known remedy, so it
      # gets its own sentence; anything else points at the run log,
      # including the confirm step's other failures, which are defects
      # here rather than a race (shakenfist/development#206). The body
      # is fixed text: nothing from the comment reaches it.
      - name: Tell the requester the re-review did not run
        if: failure() && steps.review.outcome == 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.trigger-re-review.outputs.pr_number }}
          REPO: ${{ github.repository }}
          CAUSE: ${{ steps.confirm.outputs.cause }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "${CAUSE}" = "moved" ]; then
            body="No review was posted: this pull request's head moved"
            body="${body} while the re-review was starting, so the tree it"
            body="${body} checked out is not the commit it was asked to"
            body="${body} review. Comment again to review the new head."
          else
            body="No review was posted: the re-review failed before the"
            body="${body} reviewer started. The [run log](${RUN_URL}) says"
            body="${body} why."
          fi
          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "${body}"
