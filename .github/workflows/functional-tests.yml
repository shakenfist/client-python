name: Functional tests

# NOTE(mikal): git repos are checked out to /srv/github/_work/{repo}/{repo}
# which is available as GITHUB_WORKSPACE. You can find other environment
# variables at https://docs.github.com/en/actions/learn-github-actions/environment-variables

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches:
      - develop
      - v*-releases
    paths-ignore:
      - 'docs/**'
      - mkdocs.yml
  workflow_dispatch:

jobs:
  check-bot-commit:
    name: "Check bot commit"
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, static]
    outputs:
      is_bot: ${{ steps.check.outputs.is_bot }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Check if last commit was from bot
        id: check
        run: |
          LAST_AUTHOR_EMAIL=$(git log -1 --format='%ae')
          echo "Last commit author: $LAST_AUTHOR_EMAIL"
          if [ "$LAST_AUTHOR_EMAIL" = "bot@shakenfist.com" ]; then
            echo "is_bot=true" >> $GITHUB_OUTPUT
          else
            echo "is_bot=false" >> $GITHUB_OUTPUT
          fi

  sanity_checks:
    runs-on: [self-hosted, vm]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint
      cancel-in-progress: true

    steps:
      - name: Checkout code with two commits
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Upgrade base test tools
        timeout-minutes: 5
        run: |
          python3 -mvenv /tmp/venv-test
          . /tmp/venv-test/bin/activate
          pip3 install uv
          uv pip install tox tox-uv

      - name: Lint with flake8
        timeout-minutes: 5
        run: |
          . /tmp/venv-test/bin/activate
          tox -eflake8

      - name: Attempt to install requirements
        timeout-minutes: 5
        run: |
          python3 -mvenv /tmp/venv-reqs
          . /tmp/venv-reqs/bin/activate
          pip3 install uv
          uv pip install -r pyproject.toml

      - name: Run python3 unit tests
        run: |
          . /tmp/venv-test/bin/activate
          tox -epy3

  # A smoke-tier Shaken Fist cluster deployed via the reusable
  # smoke-cluster workflow in shakenfist/actions. The deploy builds the
  # client wheel from THIS repository's PR checkout (and the server from
  # shakenfist develop), then runs the standard smoke suite -- just enough
  # of a cluster to determine a client change has not completely broken
  # things. Full-depth cluster testing lives in the shakenfist repo's own
  # CI. See remove-primary phase 8 in the shakenfist repo's docs/plans.
  functional_matrix:
    name: "${{ matrix.os.description }}"
    needs: sanity_checks
    strategy:
      fail-fast: false
      matrix:
        os: [
          {
            description: 'debian 12 single machine',
            job_name: 'debian-12-localhost',
          },
        ]
    uses: shakenfist/actions/.github/workflows/smoke-cluster.yml@main
    secrets: inherit
    with:
      component: client-python
      component_ref: ${{ github.sha }}
      tier: smoke
      concurrency_key: ${{ matrix.os.job_name }}

  automated_reviewer:
    name: "Automated reviewer"
    permissions:
      contents: read
      pull-requests: write
    runs-on: [self-hosted, claude-code]
    needs: [sanity_checks, check-bot-commit]
    if: |
      github.event_name == 'pull_request' &&
      needs.check-bot-commit.outputs.is_bot != 'true'
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-reviewer
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run automated reviewer
        uses: shakenfist/actions/review-pr-with-claude@main
        with:
          pr-number: ${{ github.event.pull_request.number }}
