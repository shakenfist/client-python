[build-system]
requires = [
    "setuptools>=61.0",
    "setuptools_scm[simple]>=6.2",
    "wheel",
    "build",
    "twine"
]
build-backend = "setuptools.build_meta"

[project]
name = "shakenfist_client"
dynamic = ["version"]

description = "The command line client for Shaken Fist"
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "click >= 8.0.0",           # bsd
    "prettytable",              # bsd
    "requests>=2.31.0",         # apache2
    "requests_toolbelt>=1.0.0", # apache2
    "chardet>=5.0.0",           # lgpl -- required by requests with this version pin
    "urllib3>=1.26.14",         # mit -- required by requests with this version pin
    "tqdm",                     # mit / mozilla
    "shakenfist-utilities",     # apache2
    "pyyaml",                   # mit
    "importlib-metadata; python_version < '3.9'",  # apache2
]

[project.urls]
"Homepage" = "https://shakenfist.com"
"Bug Tracker" = "https://github.com/shakenfist/shakenfist/issues"

[project.scripts]
sf-client = "shakenfist_client.main:cli"

# The tests run from the checkout and must not ship. The exclude below
# drops them as a package, but include-package-data defaults to true under
# pyproject.toml and setuptools_scm's file finder offers every git-tracked
# file as package data, so they would come straight back as data without
# this. Nothing in this package reads a data file at runtime.
[tool.setuptools]
include-package-data = false

# commandline/ has no __init__.py; namespaces (the default here) is what
# finds it.
[tool.setuptools.packages.find]
include = ["shakenfist_client*"]
exclude = ["shakenfist_client.tests*"]

[tool.setuptools_scm]
git_describe_command = "git describe --dirty --tags --match v* --first-parent"
write_to = "shakenfist_client/_version.py"

[project.optional-dependencies]
test = [
    # No click pin here, deliberately. The login tests assert which stream
    # each message went to, and CliRunner separates the two unconditionally
    # only from 8.2 -- which requires Python >= 3.10 and so cannot be asked
    # for while this package supports 3.7. The tests build their runner
    # through a factory which asks older click for the separation instead;
    # see runner() in tests/test_client_commandline_auth.py.
    "coverage",            # apache2
    "testtools",           # mit
    "mock",                # bsd
    "stestr",              # apache2
    "tox",                 # mit
    "flake8",              # mit
]
vdi = [
    "ryll ; sys_platform == 'linux'",   # apache2
]
